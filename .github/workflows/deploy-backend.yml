name: Deploy Backend to Render

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy backend to Render via API
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_SERVICE_ID" ]; then
            echo "Service not yet created. Creating new service..."
            curl -X POST https://api.render.com/v1/services \
              -H "Authorization: Bearer $RENDER_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
                "type": "web_service",
                "name": "breathe-esg-backend",
                "repo": "https://github.com/ankitsingh-web/Breathe-ESG.git",
                "branch": "main",
                "rootDir": "backend",
                "autoDeploy": "yes",
                "serviceDetails": {
                  "env": "python",
                  "pythonVersion": "3.11",
                  "buildCommand": "pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput",
                  "startCommand": "gunicorn config.wsgi:application --bind 0.0.0.0:10000"
                }
              }'
          else
            echo "Triggering deploy for service $RENDER_SERVICE_ID..."
            curl -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
              -H "Authorization: Bearer $RENDER_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"clearCache": "full"}'
          fi
