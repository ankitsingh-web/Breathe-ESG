name: CI and Deploy

on:
  push:
    branches:
      - main

jobs:
  backend-check:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Django checks
        working-directory: backend
        run: python manage.py check

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: backend-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy-backend-render:
    name: Deploy backend to Render
    runs-on: ubuntu-latest
    needs: backend-check
    if: secrets.RENDER_API_KEY != ''
    steps:
      - uses: actions/checkout@v4
      - name: Install Render CLI
        run: |
          curl -fsSL https://github.com/render-examples/render-cli/releases/latest/download/render-linux-amd64 -o /usr/local/bin/render
          chmod +x /usr/local/bin/render
      - name: Deploy backend
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: render deploy --service-id ${{ secrets.RENDER_SERVICE_ID_BACKEND }} --dir backend --wait

  deploy-frontend-vercel:
    name: Deploy frontend to Vercel
    runs-on: ubuntu-latest
    needs: frontend-build
    if: secrets.VERCEL_TOKEN != ''
    steps:
      - uses: actions/checkout@v4
      - name: Deploy frontend
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          prod: true
          alias: true
